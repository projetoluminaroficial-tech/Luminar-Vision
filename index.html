<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Luminar Vision</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<a-scene

  mindar-image="imageTargetSrc: /trilhas/citologia/trilha_citologia.mind;"

  embedded

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  style="width:100vw; height:100vh;"

>
  <a-assets>

    <a-asset-item
      id="celulaAnimal"
      src="trilhas/citologia/models/celula_animal_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="celulaVegetal"
      src="trilhas/citologia/models/celula_vegetal_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="virus"
      src="trilhas/citologia/models/virus_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="bacteria"
      src="trilhas/citologia/models/bacteria_3d.glb">
    </a-asset-item>

  </a-assets>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>

  <a-entity
    light="type: directional; intensity: 1"
    position="0 1 1">
  </a-entity>

  <!-- TARGET 0 -->

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity
      gltf-model="#celulaAnimal"
      scale="1.5 1.5 1.5">
    </a-entity>

  </a-entity>

  <!-- TARGET 1 -->

  <a-entity mindar-image-target="targetIndex: 1">

    <a-entity
      gltf-model="#celulaVegetal"
      scale="1.5 1.5 1.5">
    </a-entity>

  </a-entity>

  <!-- TARGET 2 -->

  <a-entity mindar-image-target="targetIndex: 2">

    <a-entity
      gltf-model="#virus"
      scale="1.5 1.5 1.5">
    </a-entity>

  </a-entity>

  <!-- TARGET 3 -->

  <a-entity mindar-image-target="targetIndex: 3">

    <a-entity
      gltf-model="#bacteria"
      scale="1.5 1.5 1.5">
    </a-entity>

  </a-entity>

  <a-camera
    position="0 0 0"
    look-controls="enabled: true">
  </a-camera>

</a-scene>

</body>
</html>
