<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste MindAR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

/* cena ocupa tudo */
a-scene {
  position: fixed !important;
  inset: 0;
}

/* 🔥 força câmera full */
video {
  position: fixed !important;
  top: 0;
  left: 0;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover;
  z-index: 0;
}

/* 🔥 força render 3D full */
canvas {
  position: fixed !important;
  top: 0;
  left: 0;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 1;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: trilhas/citologia/celula_animal/targets.mind;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; precision: mediump;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>
    <a-asset-item id="modelo" src="trilhas/citologia/celula_animal/celula_animal_3d.glb"></a-asset-item>
  </a-assets>

  <!-- LUZ -->
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1" position="0 1 1"></a-entity>

  <!-- TARGET -->
  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity
      gltf-model="#modelo"
      scale="0.8 0.8 0.8"
      position="0 0 0"
      rotation="0 0 0">
    </a-entity>

  </a-entity>

  <a-camera position="0 0 0"></a-camera>

</a-scene>

</body>
</html>
