<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Luminar Vision</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<a-scene

  mindar-image="imageTargetSrc: trilhas/citologia/trilha_citologia.mind;"

  embedded

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  style="width:100vw; height:100vh;"

>

  <a-assets>

    <a-asset-item
      id="celulaAnimal"
      src="trilhas/citologia/models/celula_animal_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="celulaVegetal"
      src="trilhas/citologia/models/celula_vegetal_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="virus"
      src="trilhas/citologia/models/virus_3d.glb">
    </a-asset-item>

    <a-asset-item
      id="bacteria"
      src="trilhas/citologia/models/bacteria_3d.glb">
    </a-asset-item>

  </a-assets>


  <!-- LUZ -->

  <a-entity
    light="type: ambient; intensity: 1.5">
  </a-entity>

  <a-entity
    light="type: directional; intensity: 1"
    position="0 1 1">
  </a-entity>


  <!-- TARGET 0 -->

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity
      gltf-model="#celulaAnimal"
      scale="1.5 1.5 1.5"
      rotation="90 0 0"
      touch-controls>
    </a-entity>

  </a-entity>


  <!-- TARGET 1 -->

  <a-entity mindar-image-target="targetIndex: 1">

    <a-entity
      gltf-model="#celulaVegetal"
      scale="1.5 1.5 1.5"
      rotation="90 0 0"
      touch-controls>
    </a-entity>

  </a-entity>


  <!-- TARGET 2 -->

  <a-entity mindar-image-target="targetIndex: 2">

    <a-entity
      gltf-model="#virus"
      scale="0.5 0.5 0.5"
      rotation="90 0 0"
      touch-controls>
    </a-entity>

  </a-entity>


  <!-- TARGET 3 -->

  <a-entity mindar-image-target="targetIndex: 3">

    <a-entity
      gltf-model="#bacteria"
      scale="0.01 0.01 0.01"
      rotation="90 0 0">
    </a-entity>

  </a-entity>

  <!-- CAMERA -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>

<script>

AFRAME.registerComponent('touch-controls', {

  init: function () {

    let el = this.el;

    let isDragging = false;

    let previousX = 0;

    let currentScale = 1;

    // ROTAÇÃO

    window.addEventListener('touchstart', (e) => {

      if (e.touches.length === 1) {

        isDragging = true;

        previousX = e.touches[0].clientX;

      }

    });

    window.addEventListener('touchend', () => {

      isDragging = false;

    });

    window.addEventListener('touchmove', (e) => {

      // GIRAR

      if (isDragging && e.touches.length === 1) {

        let deltaX =
          e.touches[0].clientX - previousX;

        previousX = e.touches[0].clientX;

        el.object3D.rotation.y += deltaX * 0.01;

      }

      // PINÇA ZOOM

      if (e.touches.length === 2) {

        const dx =
          e.touches[0].clientX -
          e.touches[1].clientX;

        const dy =
          e.touches[0].clientY -
          e.touches[1].clientY;

        const distance =
          Math.sqrt(dx * dx + dy * dy);

        currentScale = distance / 200;

        currentScale =
          Math.max(0.2,
          Math.min(currentScale, 5));

        el.object3D.scale.set(
          currentScale,
          currentScale,
          currentScale
        );

      }

    });

  }

});

</script>

</body>

</html>
