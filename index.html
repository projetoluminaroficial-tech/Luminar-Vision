<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Luminar Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: trilhas/citologia/celula_animal/targets.mind;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  style="width:100vw; height:100vh;"
>

  <a-assets>
    <a-asset-item id="modelo" src="trilhas/citologia/celula_animal/celula_animal_3d.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 1" position="0 1 1"></a-entity>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity
      gltf-model="#modelo"
      scale="1 1 1">
    </a-entity>
  </a-entity>

  <a-camera position="0 0 0"></a-camera>

</a-scene>

</body>
</html>
