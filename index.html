<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Luminar Vision MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>

<style>
body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }

/* Tela inicial */
#start {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#000; color:#fff;
  z-index:100;
}

#start button {
  padding:14px 28px;
  border-radius:30px;
  border:2px solid cyan;
  background:transparent;
  color:cyan;
  cursor:pointer;
}

/* UI */
#ui {
  position:fixed; inset:0;
  display:none;
  pointer-events:none;
}

#top {
  position:absolute;
  top:0; left:0; right:0;
  height:50px;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  pointer-events:all;
}

#scanner {
  position:absolute;
  top:50%; left:50%;
  width:220px; height:220px;
  transform:translate(-50%,-50%);
  border:2px solid cyan;
  border-radius:12px;
}

.detected {
  border-color:#00ff88 !important;
  box-shadow:0 0 20px #00ff88;
}

#hint {
  position:absolute;
  bottom:80px;
  width:100%;
  text-align:center;
  color:#ccc;
}
</style>
</head>

<body>

<!-- Tela inicial -->
<div id="start">
  <h1>Luminar Vision</h1>
  <p>Aponte para o marcador</p>
  <button id="btnStart">Iniciar</button>
</div>

<!-- UI -->
<div id="ui">
  <div id="top">
    <span>Luminar AR</span>
    <button onclick="location.reload()">Sair</button>
  </div>
  <div id="scanner"></div>
  <div id="hint">Aguardando marcador...</div>
</div>

<!-- Cena AR -->
<a-scene
embedded
vr-mode-ui="enabled: false"
renderer="logarithmicDepthBuffer: true;"
arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <a-asset-item id="modelo" src="trilhas/citologia/celula_animal/celula_animal_3d.glb"></a-asset-item>
  </a-assets>

  <a-nft
    id="marker"
    type="nft"
    url="trilhas/citologia/celula_animal/celula_animal"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-entity
      gltf-model="#modelo"
      scale="0.3 0.3 0.3"
      rotation="-90 0 0"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 6000; easing: linear"
    ></a-entity>
  </a-nft>

  <a-entity camera></a-entity>
</a-scene>

<script>
const start = document.getElementById('start');
const ui = document.getElementById('ui');
const scanner = document.getElementById('scanner');
const hint = document.getElementById('hint');
const marker = document.getElementById('marker');

document.getElementById('btnStart').onclick = () => {
  start.style.display = 'none';
  ui.style.display = 'block';
  setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
};

// feedback visual
marker.addEventListener('markerFound', () => {
  scanner.classList.add('detected');
  hint.textContent = "Modelo detectado!";
});

marker.addEventListener('markerLost', () => {
  scanner.classList.remove('detected');
  hint.textContent = "Aponte para o marcador";
});
</script>

</body>
</html>
